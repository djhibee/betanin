name: Release
on:
  push:
    branches:
      - master

jobs:
  test-frontend:
    name: Lint and test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: betanin_client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: betanin_client
      - name: Lint
        run: npm run lint
        working-directory: betanin_client
      - name: Check formatting
        run: npm run check-formatting
        working-directory: betanin_client

  test-backend:
    name: Lint and test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9.x
          cache: 'pip'
          cache-dependency-path: |
            setup.py
            setup.cfg
      - name: Install dependencies
        run: pip install --user . .[dev]
      - name: Check imports
        run: isort --check-only $(git ls-files "*.py")
      - name: Check formatting
        run: black --check $(git ls-files "*.py")
      - name: Check types
        if: ${{ false }}
        run: pyright .

  release-please:
    name: Run Release Please
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Release Please
        uses: google-github-actions/release-please-action@v4 # Mis à jour à la v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          changelog-path: CHANGELOG.md
          package-name: betanin

  build-release:
    name: Build, tag, and publish Docker image
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:master
      - name: Login into DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
            ${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-pypa:
    name: Build and push to PyPA
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: betanin_client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: betanin_client
      - name: Install frontend
        run: PRODUCTION=true npm run-script build
        working-directory: betanin_client
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9.x
          cache: 'pip'
          cache-dependency-path: |
            setup.py
            setup.cfg
      - name: Push to PyPA
        run: |
          set -e
          pip install --no-cache --upgrade build twine
          python -m build
          python -m twine upload --username "__token__" --password "${{ secrets.PYPI_TOKEN }}" --disable-progress-bar dist/*
